# SonarQube project configuration for NutriTrace
sonar.projectKey=NutriTrace
sonar.projectName=NutriTrace
sonar.projectVersion=1.0

# Sources and tests
sonar.sources=app,config,database,routes,resources
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# PHP
sonar.php.version=8.5
sonar.php.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,tests/**,**/*.blade.php
sonar.test.exclusions=tests/**
sonar.coverage.exclusions=tests/**,database/**,config/**,resources/**,routes/**

# Duplication / issue exclusions for generated or framework files
sonar.cpd.exclusions=database/migrations/**

# SCM
sonar.scm.provider=git
