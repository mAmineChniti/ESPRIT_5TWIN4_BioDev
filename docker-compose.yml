services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: http://localhost:8000
      # Leave empty to have one generated and persisted in the storage volume.
      APP_KEY: "${APP_KEY:-}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nutritrace}
      DB_USERNAME: ${DB_USERNAME:-nutritrace}
      DB_PASSWORD: ${DB_PASSWORD:-nutritrace}
    volumes:
      # Keeps the generated APP_KEY plus sessions, cache and logs across restarts.
      - nutritrace-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-nutritrace}
      MYSQL_DATABASE: ${DB_DATABASE:-nutritrace}
      MYSQL_USER: ${DB_USERNAME:-nutritrace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nutritrace}
    volumes:
      - nutritrace-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nutritrace-db:
  nutritrace-storage: