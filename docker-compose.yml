services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-nutritrace}"
      DB_USERNAME: "${DB_USERNAME:-nutritrace}"
      DB_PASSWORD: "${DB_PASSWORD:-nutritrace}"
    volumes:
      - nutritrace-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-nutritrace}"
      MYSQL_DATABASE: "${DB_DATABASE:-nutritrace}"
      MYSQL_USER: "${DB_USERNAME:-nutritrace}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-nutritrace}"
    volumes:
      - nutritrace-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  nutritrace-db:
  nutritrace-storage:
