# Render Blueprint for NutriTrace
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repo

services:
  - type: web
    name: nutritrace
    runtime: docker
    plan: free
    healthCheckPath: /up
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: NutriTrace
      - key: APP_URL
        value: https://nutritrace.onrender.com
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: nutritrace-db
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: nutritrace-db
          property: port
      - key: DB_DATABASE
        value: nutritrace
      - key: DB_USERNAME
        value: nutritrace
      - key: DB_PASSWORD
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

  - type: pserv
    name: nutritrace-db
    runtime: image
    image:
      url: mysql:8.0
    plan: free
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: nutritrace
      - key: MYSQL_USER
        value: nutritrace
      - key: MYSQL_PASSWORD
        sync: false
    # NOTE: Render free tier does not support persistent disks. Database data is
    # ephemeral on free tier; upgrade the plan or use an external MySQL provider
    # for durable storage.
